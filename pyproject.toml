[project]
name = "sf-aic2"
version = "0.1.0"
description = "Smart Factory AI Command Center — plan/CT digital twin, electrical + OT network twin, virtual PLC, TypeSafe Jev structured decisions, independent safety gate (simulation research)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "simpy>=4.1",
  "pandapower>=2.14",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "jsonschema>=4.23",
  "websockets>=12",
  "typesafe-sdk>=0.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
vision = ["opencv-python-headless>=4.10", "ultralytics>=8.3", "torch>=2.4"]
analysis = ["scipy>=1.13", "matplotlib>=3.9", "scikit-learn>=1.5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 120
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["sfaic2*"]
